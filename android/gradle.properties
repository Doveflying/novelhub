# 书萤 · Android 构建属性

# AndroidX：appcompat / core-ktx / webkit 都是 AndroidX 依赖，
# 不开这个开关 AGP 会直接拒绝构建（checkDebugAarMetadata 报错）。
android.useAndroidX=true
android.enableJetifier=false

# 允许工程路径含非 ASCII 字符。
# AGP 默认会拦中文路径（这台机器用户目录是「韩凌云」），
# 实际构建没问题，只是 aapt2 偶尔对路径敏感，所以正式构建仍建议
# 放在纯 ASCII 目录（见 android/build_apk.ps1）。
android.overridePathCheck=true

# 构建期内存与缓存
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Chaquopy 的 pip 走镜像，默认源在这台机器上超时（见 app/build.gradle.kts）
